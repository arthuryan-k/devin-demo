version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /services/auth-service
      - /services/gateway
      - /services/history-writer
      - /services/reference-data-service
      - /services/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: pip
    directories:
      - /services/market-data
      - /services/portfolio
      - /services/risk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directories:
      - /services/matching-engine
      - /services/simulator
      - /services/fix-gateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directories:
      - /services/eod-recon
      - /services/matching-engine
    schedule:
      interval: monthly
