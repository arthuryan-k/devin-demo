name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-node:
    name: lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, auth-service, reference-data-service, history-writer, web]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - name: ESLint + Prettier
        run: npm run lint

  lint-python:
    name: lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [market-data, portfolio, risk]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.8.6
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .

  lint-java:
    name: lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: matching-engine
            java: '17'
          - service: simulator
            java: '17'
          - service: fix-gateway
            java: '8'
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - name: Checkstyle
        run: mvn -B checkstyle:check

  matching-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/matching-engine/pom.xml
      - name: Unit tests and Redpanda integration tests
        run: mvn -B verify
  java-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: simulator
            java: '17'
          - service: fix-gateway
            java: '8'
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml
      - run: mvn -B verify
  node-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, reference-data-service, history-writer]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Testcontainers: Postgres + Flyway (db/migrations), and Redpanda for history-writer.
      - run: npm test

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [portfolio, risk]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests start a throwaway Postgres and apply db/migrations with the Flyway image (docker).
      - run: python -m pytest -q

  eod-recon:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/eod-recon
    steps:
      - uses: actions/checkout@v4
      - run: perl -c bin/eod_recon.pl && sh -n bin/eod_run.sh
      - run: prove -v t/

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json
      - run: docker compose up -d --wait redpanda
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit and Redpanda integration tests
        run: npm test
        env:
          KAFKA_BROKERS: localhost:19092

  market-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/market-data/requirements*.txt
      - run: docker compose up -d --wait redpanda
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - name: Unit and Redpanda integration tests
        run: python -m pytest -q
        env:
          KAFKA_BROKERS: localhost:19092

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Pages mock e2e (builds dist-pages)
        run: npm run test:e2e
