name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  matching-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/matching-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/matching-engine/pom.xml
      - name: Unit tests and Redpanda integration tests
        run: mvn -B verify
      - name: Browser build
        run: scripts/build-pages.sh

  node-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, reference-data-service, history-writer]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Testcontainers: Postgres + Flyway (db/migrations), and Redpanda for history-writer.
      - run: npm test

  python-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [portfolio, risk]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/*/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Tests start a throwaway Postgres and apply db/migrations with the Flyway image (docker).
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json
      - run: docker compose up -d --wait redpanda
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit and Redpanda integration tests
        run: npm test
        env:
          KAFKA_BROKERS: localhost:19092

  market-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/market-data/requirements*.txt
      - run: docker compose up -d --wait redpanda
        working-directory: .
      - run: pip install -r requirements-dev.txt
      - name: Unit and Redpanda integration tests
        run: python -m pytest -q
        env:
          KAFKA_BROKERS: localhost:19092
