name: CI

on:
  pull_request:

jobs:
  matching-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/matching-engine/pom.xml
      - name: Unit tests and Redpanda integration tests
        run: mvn -B verify
        working-directory: services/matching-engine
      - name: Browser build
        run: scripts/build-pages.sh
        working-directory: services/matching-engine
      - name: Compose config
        run: docker compose config --quiet
