# Event bus (Redpanda, Kafka API) + the standalone matching engine.
#   docker compose up --build
# Kafka clients on the host use localhost:19092; containers use redpanda:9092.
name: devin-demo

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Topics are created by the matching engine with exactly one partition each; never auto-create.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.18
    entrypoint: ["rpk", "cluster", "config", "set", "auto_create_topics_enabled", "false", "-X", "admin.hosts=redpanda:9644"]
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  matching-engine:
    build:
      context: services/matching-engine
      args:
        MAVEN_MIRROR: ${MAVEN_MIRROR:-}
    image: devin-demo/matching-engine:latest
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SYMBOLS: ACME,GLOBX,INITD,NVTA
      JOURNAL_PATH: /data/journal
      SNAPSHOT_EVERY: "10000"
    volumes:
      - engine-journal:/data/journal
    restart: unless-stopped

volumes:
  redpanda-data:
  engine-journal:
